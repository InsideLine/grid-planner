<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Planner</title>
<style>
:root{
  --bg:#f3f2ee; --panel:#ffffff; --ink:#1c1b19; --muted:#6c6b65; --line:#e1dfd8;
  --accent:#0d6e6e; --accent-ink:#ffffff; --danger:#b3261e;
  --warn-bg:#fff3d1; --warn-ink:#674800; --info-bg:#e6f1f0; --info-ink:#0d4f4f;
  --tile-empty:#eae8e1; --post-bg:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;                 /* scroll bars and menus drawn by the browser go dark too */
    --bg:#151513; --panel:#1f1f1c; --ink:#eeede8; --muted:#a3a29b; --line:#34332f;
    --accent:#43c2b7; --accent-ink:#04211f; --danger:#ff8a80;
    --warn-bg:#3a2f10; --warn-ink:#f3d58a; --info-bg:#12302e; --info-ink:#a9e3dd;
    --tile-empty:#2a2926;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
h2{font-size:14px;margin:0;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--danger)}
button.wide{width:100%}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.01em;margin-right:6px}
.logo{display:grid;grid-template-columns:repeat(3,5px);gap:2px}
.logo i{width:5px;height:6.5px;background:var(--accent);border-radius:1px}
.logo i:nth-child(2),.logo i:nth-child(6),.logo i:nth-child(7){opacity:.45}
.field{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}
.field select,.field input{color:var(--ink)}
.field input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.spacer{flex:1}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;user-select:none}
.menu summary::-webkit-details-marker{display:none}
.menu summary::after{content:" ▾";color:var(--muted)}
.menuBody{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:grid;gap:6px;width:240px}
.menuBody button{text-align:left}
.menuBody p{font-size:12px;padding:2px 4px}

/* layout */
main{display:grid;grid-template-columns:236px minmax(0,1fr) 344px;min-height:0}
.panel{background:var(--panel);padding:14px;overflow-x:hidden;overflow-y:auto;scrollbar-gutter:stable;min-height:0}
#library{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#side{border-left:1px solid var(--line)}
#stage{overflow:auto;padding:20px 16px 48px;min-height:0}
.panelHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.stageCard{max-width:540px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stageHead{margin-bottom:12px}
.stageHead p{font-size:13px}
#gridWrap{padding:2px 0}
.rowTools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.rowTools button{font-size:12.5px;padding:5px 10px}
.hint{font-size:12.5px;margin-top:12px;text-align:center}

/* library */
.libList{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:var(--tile-empty);cursor:grab;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb .usedTag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:9px}
.thumb .x{position:absolute;right:4px;top:4px;width:20px;height:20px;padding:0;border-radius:50%;border:none;background:rgba(0,0,0,.62);color:#fff;line-height:18px;font-size:14px;opacity:0}
.thumb:hover .x,.thumb .x:focus-visible{opacity:1}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:16px 12px;text-align:center;color:var(--muted);font-size:13px}

/* grid */
.grid{position:relative;margin:0 auto;touch-action:none;user-select:none}
.cell{position:absolute;overflow:hidden;background:var(--tile-empty);cursor:pointer}
.cell.filled{cursor:grab}
.cell .plus{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:22px;opacity:.4}
.cell:hover .plus{opacity:1}
.cell.drop{outline:2px solid var(--accent);outline-offset:-2px}
.slice{position:relative;overflow:hidden;background:var(--post-bg)}
.slice img,.cropper img{position:absolute;left:0;top:0;max-width:none;pointer-events:none;user-select:none}
.badge{position:absolute;left:5px;top:5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:rgba(0,0,0,.64);color:#fff;font:600 11px/20px system-ui,sans-serif;text-align:center;pointer-events:none}
.cell.posted .slice{opacity:.4}
.cell.posted .badge{background:var(--accent);color:var(--accent-ink)}
.selbox{position:absolute;border:2px solid var(--accent);border-radius:2px;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.ghost{position:absolute;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent);pointer-events:none;border-radius:2px;z-index:5}
.ghost.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,transparent)}

/* checks */
#checks{display:grid;gap:8px;margin-top:12px}
.msg{border-radius:8px;padding:8px 10px;font-size:12.5px}
.msg.warn{background:var(--warn-bg);color:var(--warn-ink)}
.msg.info{background:var(--info-bg);color:var(--info-ink)}

/* side panel */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:14px}
.tabs button{border:none;background:none;padding:6px 8px;border-radius:7px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cropper{position:relative;overflow:hidden;margin:0 auto;cursor:grab;touch-action:none;border-radius:4px;box-shadow:0 0 0 1px var(--line);background:var(--post-bg)}
.cropper:active{cursor:grabbing}
.cropper .vline,.cropper .hline{position:absolute;pointer-events:none;filter:drop-shadow(0 0 1px rgba(0,0,0,.9))}
.cropper .vline{top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.95)}
.cropper .hline{left:0;right:0;border-top:1px dashed rgba(255,255,255,.95)}
.cropper .bleed{position:absolute;top:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(0,0,0,.5) 0 4px,rgba(0,0,0,.26) 4px 8px)}
.sub{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.group{margin-top:16px}
.group>label,.group>.lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
input[type=range]{width:100%;margin:2px 0;accent-color:var(--accent)}
.btnRow{display:flex;gap:6px;flex-wrap:wrap}
.btnRow button{flex:1;font-size:12.5px;padding:6px 8px}
.seg{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.seg span{width:66px;font-size:13px}
.seg div{display:flex;gap:4px;flex:1}
.seg button{flex:1;padding:5px 0}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.note{font-size:12.5px;margin-top:8px}
.note.bad{color:var(--warn-ink);background:var(--warn-bg);padding:6px 9px;border-radius:7px}
.fileInfo{font-size:12px;color:var(--muted);margin-top:14px;overflow-wrap:anywhere}
.help ol,.help ul{padding-left:20px;margin:8px 0 0}
.help li{margin-bottom:7px}
.help h3{font-size:13px;margin:18px 0 0}
.postHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.postList{display:grid;gap:6px;margin-top:12px}
.postRow{display:grid;grid-template-columns:24px 38px minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:9px}
.postRow.done{opacity:.55}
.postRow .num{font-weight:700;text-align:center}
.postRow .t1{font-size:13px}
.postRow .t2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.postRow button{padding:4px 9px;font-size:12px}
.postRow input{width:17px;height:17px;accent-color:var(--accent)}

textarea,input[type=password],input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;resize:vertical}
.small{font-size:12.5px}
.igBox{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px;display:grid;gap:9px}
.igBox h3{font-size:13.5px;margin:0}
.igBox .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.igBox details{font-size:12.5px}
.igBox details summary{cursor:pointer;color:var(--muted)}
.igBox details ol{padding-left:18px;margin:8px 0 0}
.igBox details li{margin-bottom:6px}
.igBox details .btnRow{margin-top:8px}
.igBox code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px;overflow-wrap:anywhere}
.igBox .field{justify-content:space-between}
.linkBtn{border:none;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:12px}
.runNote{font-size:12.5px;font-weight:600}
.postRow a{font-size:11.5px;color:var(--accent)}
.handBox{border:1px solid var(--accent);border-radius:10px;padding:12px;margin-bottom:14px;display:grid;gap:9px}
.handBox h3{font-size:13.5px;margin:0}
.handNext{display:grid;grid-template-columns:84px minmax(0,1fr);gap:11px;align-items:center}
.handNext .t1{font-size:14px;font-weight:600}
.handNext .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handCap{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:140px;overflow:auto}
.handBox details{font-size:12.5px}
.handBox details summary{cursor:pointer;color:var(--muted)}
.handBox details ol{padding-left:18px;margin:8px 0 0}
.handBox details li{margin-bottom:6px}
.autoBox{margin-top:16px}
.autoBox>summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:4px 0}
.autoBox .igBox{margin:8px 0 0}
.slice canvas,.cropper canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.group select{width:100%}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:10px 0}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px}
.checks label.off{color:var(--muted)}
.checks input{width:15px;height:15px;accent-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#222;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:min(92vw,520px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  body{overflow:auto;display:block}
  main{display:block}
  .panel,#stage{overflow:visible}
  #library,#side{border:none;border-bottom:1px solid var(--line)}
  .libList{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
}
</style>
<meta name="grid-planner-web" content="1">
<meta name="description" content="Plan an Instagram profile grid, split photos across tiles and export them ready to post. Photos stay on your computer.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grid Planner">
<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151513" media="(prefers-color-scheme: dark)">
</head>
<body>

<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>Grid Planner</div>
  <label class="field">Post size <select id="format"></select></label>
  <label class="field">Fill color <input type="color" id="bg" value="#ffffff" title="Shown wherever a photo doesn't cover its tiles"></label>
  <label class="field">Sharpen <select id="sharpen" title="Crispness put back after a photo is shrunk to Instagram's size"><option value="off">Off</option><option value="std">Standard</option><option value="strong">Strong</option></select></label>
  <label class="field"><input type="checkbox" id="showOrder" checked> Show post order</label>
  <span class="spacer"></span>
  <button id="btnAdd" class="primary">Add photos</button>
  <button id="btnZip">Download tiles (.zip)</button>
  <details class="menu" id="projMenu">
    <summary>Project</summary>
    <div class="menuBody">
      <button id="btnSave">Save project file…</button>
      <button id="btnOpen">Open project file…</button>
      <button id="btnClear" class="danger">Start over</button>
      <p class="muted" id="saveNote">Your plan is saved automatically in this browser.</p>
    </div>
  </details>
</header>

<main>
  <aside class="panel" id="library">
    <div class="panelHead"><h2>Photos</h2><span id="libCount" class="muted"></span></div>
    <div id="libList" class="libList"></div>
    <div id="libEmpty" class="empty">Add photos, or drop them anywhere on this page — a zip from Google Photos works too.<br>Then drag them onto the grid.</div>
    <button id="btnPlaceAll" class="wide">Place unused photos</button>
  </aside>

  <section id="stage">
    <div class="stageCard">
      <div class="stageHead">
        <h2>Profile grid preview</h2>
        <p class="muted">Newest post sits top-left. Drag photos to move or swap them.</p>
      </div>
      <div id="gridWrap"><div id="grid" class="grid"></div></div>
      <div class="rowTools">
        <button id="btnRowTop">Insert row at top</button>
        <button id="btnCompact">Close empty rows</button>
      </div>
      <p id="formatHint" class="muted hint"></p>
      <div id="checks"></div>
    </div>
  </section>

  <aside class="panel" id="side">
    <div class="tabs" role="tablist">
      <button id="tabEdit" role="tab">Edit photo</button>
      <button id="tabPost" role="tab">Posting order</button>
    </div>
    <div id="pane"></div>
  </aside>
</main>

<input type="file" id="filePick" accept="image/*,.zip,application/zip,application/x-zip-compressed" multiple hidden>
<input type="file" id="projPick" accept=".json,application/json" hidden>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';

// ---------- constants ----------
const COLS = 3, GAP = 3, GRID_ASPECT = 3 / 4, ZMIN = 0.1, ZMAX = 6, MAXH = 5;
const FORMATS = {
  '4x5': { W: 1080, H: 1350, label: '4:5 portrait · 1080×1350' },
  '3x4': { W: 1080, H: 1440, label: '3:4 tall · 1080×1440' },
  '1x1': { W: 1080, H: 1080, label: '1:1 square · 1080×1080' },
};
const HINTS = {
  '4x5': 'The grid hides a thin strip on each side of a 4:5 post (hatched in the editor). Split photos overlap by that strip so the grid still lines up. Accepted by the app, schedulers and the API.',
  '3x4': 'A 3:4 post fills its grid tile exactly, with nothing hidden, and is the tallest photo Instagram keeps whole. Post these from the Instagram phone app — instagram.com, schedulers and the API may cut or reject anything taller than 4:5.',
  '1x1': 'The grid hides a wide strip on each side of a square post (hatched in the editor). Keep faces and text away from the edges.',
};
const SHARPEN = { off: 0, std: 0.3, strong: 0.6 };      // how much crispness is put back after shrinking
const FRAMES = { mat: 'Gallery mat', bar: 'Info bar', thin: 'Thin border', film: 'Film edge' };
const BACKS = { white: 'White', black: 'Black', blur: 'Blurred photo', fill: 'Same as “Fill color”' };      // what a frame's border is made of
const BLUR_MAX = 70;                    // a blurred border at 100%: this many pixels of blur on a 1080-wide post
const FRAME_FIELDS = [['camera', 'Camera'], ['lens', 'Lens'], ['settings', 'Settings'], ['film', 'Film simulation'], ['date', 'Date']];
const SANS = '"Segoe UI Variable Display","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif';
const MONO = '"Cascadia Mono","Cascadia Code",Consolas,Menlo,monospace';
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// Fujifilm's own numbers for its film simulations (colour ones, then the black-and-white ones)
const FUJI_FILM = { 0x0: 'Provia', 0x100: 'Studio Portrait', 0x110: 'Studio Portrait', 0x120: 'Astia', 0x130: 'Studio Portrait', 0x200: 'Velvia', 0x300: 'Studio Portrait Ex', 0x400: 'Velvia',
  0x500: 'Pro Neg. Std', 0x501: 'Pro Neg. Hi', 0x600: 'Classic Chrome', 0x700: 'Eterna', 0x800: 'Classic Neg.', 0x900: 'Eterna Bleach Bypass', 0xa00: 'Nostalgic Neg.', 0xb00: 'Reala Ace' };
const FUJI_MONO = { 0x300: 'Monochrome', 0x301: 'Monochrome + R', 0x302: 'Monochrome + Ye', 0x303: 'Monochrome + G', 0x310: 'Sepia', 0x500: 'Acros', 0x501: 'Acros + R', 0x502: 'Acros + Ye', 0x503: 'Acros + G' };

// ---------- state ----------
const state = { format: '4x5', bg: '#ffffff', sharpen: 'std', showOrder: true, rows: 4, items: [], posted: {}, links: {}, selected: null };
let server = null;                      // status from server.py; stays null when the page is opened as a plain file
const inProgram = !!(window.chrome && window.chrome.webview);   // running inside Grid Planner.exe, which has no posting server
const isMac = /^mac/i.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '');
const UNDO_KEY = isMac ? '⌘Z' : 'Ctrl+Z';
const onWeb = !!document.querySelector('meta[name="grid-planner-web"]');     // the copy published on the web ("Web version" folder adds this tag)
const localHost = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
// Automatic posting needs server.py on this computer, started with a Windows .bat file: on a Mac or on the web copy it is only offered if that server is somehow running.
const offerAuto = () => !inProgram && (!!server || (!isMac && !onWeb));
const run = { active: false, stop: false, note: '', error: '', delay: 10, noteEl: null };   // a posting run in progress
const images = new Map();   // id -> {id,name,blob,previewBlob,w,h,url,fullUrl,fullEl}
let tab = 'edit', views = [], metrics = { dw: 100, dh: 133 }, pick = null, db = null;

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null) continue;
    if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'style') Object.assign(n.style, v);
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k in n) n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid);
  return n;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3600);
}

// Lock the page while photos are being read or rendered, so nothing can change underneath a slow job.
let busyCount = 0;
async function withBusy(msg, fn) {      // fn gets say(text), which changes the message while the job runs
  const t = $('#toast');
  let shown = false;
  const show = setTimeout(() => { shown = true; clearTimeout(toastTimer); t.textContent = msg; t.classList.add('show'); }, 250);
  const say = text => { msg = text; if (shown) t.textContent = text; };
  busyCount++; $('header').inert = true; $('main').inert = true;
  try { return await fn(say); }
  finally {
    clearTimeout(show);
    if (!--busyCount) { $('header').inert = run.active; $('main').inert = false; }
    if (t.textContent === msg) t.classList.remove('show');
  }

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* no clipboard access: try the old way */ }
  const ta = el('textarea', { value: text, style: { position: 'fixed', left: '-999px', opacity: '0' } });
  document.body.append(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { /* nothing more to try */ }
  ta.remove(); return ok;
}

  if (facts.length) box.append(el('p', { class: 'muted small', text: facts.join(' · ') }));
  if (server.token_error) box.append(el('div', { class: 'msg warn', text: server.token_error }));

  // Instagram downloads each image from a public address, so one has to exist while posting.
  const linkReady = server.practice || server.public_base_url || server.cloudflared;
  if (server.public_base_url) box.append(el('p', { class: 'muted small', text: `Instagram collects each tile from your own address: ${server.public_base_url}` }));
  else if (server.cloudflared) box.append(el('p', { class: 'muted small', text: 'While posting, a temporary Cloudflare link lets Instagram collect each tile. It closes by itself about 10 minutes after the last post, or when you quit the app.' }));
  else if (!server.practice) box.append(el('div', { class: 'msg warn' },
    'Instagram has to collect each image from a public address. Install cloudflared so the app can open a temporary one: run ',
    el('code', { text: 'winget install --id Cloudflare.cloudflared' }), ' in a terminal, then restart the app.'));
  if (!server.practice) {
    const own = el('input', { type: 'text', value: server.public_base_url || '', placeholder: 'https://…', spellcheck: false, 'aria-label': 'Your own public address' });
    box.append(el('details', null, el('summary', { text: 'Use my own public address instead' }),
      el('p', { class: 'muted', style: { margin: '8px 0' }, text: `Advanced: an https address that forwards to port ${server.media_port} on this PC (your own tunnel or reverse proxy). Leave empty to use the Cloudflare link.` }),
      own, el('div', { class: 'btnRow' }, el('button', { text: 'Save address', disabled: run.active, onclick: async () => {
        try { server = await api('/api/settings', { method: 'POST', json: { public_base_url: own.value.trim() } }); renderAll(); } catch (e) { toast(e.message); }
      } }))));
  }

  const remaining = order.filter(t => !state.posted[t.key]).length;
  let block = '';
  if (state.format === '3x4') block = 'Instagram’s API rejects 3:4 images. Switch “Post size” to 4:5 or 1:1 to post from here.';
  if (block) box.append(el('div', { class: 'msg warn', text: block }));
  const ready = !block && linkReady && !server.token_error && remaining > 0 && !run.active;

  const delay = el('select', { 'aria-label': 'Pause between posts', disabled: run.active });
  for (const s of [5, 10, 30, 60]) delay.append(el('option', { value: s, text: `${s} seconds` }));
  delay.value = run.delay; delay.addEventListener('change', () => { run.delay = +delay.value; });
  box.append(el('label', { class: 'field small' }, 'Pause between posts', delay));
  box.append(el('div', { class: 'btnRow' },
    el('button', { text: 'Post next', disabled: !ready, onclick: () => postRun(false) }),
    el('button', { class: 'primary', text: remaining ? `Post all ${remaining} remaining` : 'Everything is posted', disabled: !ready, onclick: () => postRun(true) })));
  if (run.active) box.append(el('button', { text: run.stop ? 'Stopping after this post…' : 'Stop after this post', disabled: run.stop, onclick: () => { run.stop = true; renderAll(); } }));
  run.noteEl = el('p', { class: 'runNote', text: run.note, hidden: !run.note }); box.append(run.noteEl);
  if (run.error) box.append(el('div', { class: 'msg warn', text: run.error }));
  return box;
}

// Publishes the tiles that are not ticked yet, strictly in posting order, and stops at the first problem:
// skipping a tile would shift every later one on the profile.
async function postRun(all) {
  if (run.active || !server || !server.connected) return;
  const order = postingOrder();
  const todo = order.map((t, i) => ({ t, n: i + 1 })).filter(x => !state.posted[x.t.key]);
  if (!todo.length) return;
  const batch = all ? todo : todo.slice(0, 1), many = batch.length > 1;
  const firstOpen = order.findIndex(t => !state.posted[t.key]);
  const warn = checks().filter(m => m.level === 'warn').map(m => m.text);
  if (order.some((t, i) => i > firstOpen && state.posted[t.key])) warn.push('Later posts are already ticked while earlier ones are not, so your profile may not end up matching this layout.');
  const lines = server.practice
    ? [`Practice run: ${batch.length} post${many ? 's' : ''}. Nothing will be sent to Instagram.`]
    : [`Publish ${batch.length} post${many ? 's' : ''} to @${server.username} now?`, '',
       many ? `Posts #${batch[0].n} to #${batch[batch.length - 1].n} go up one after another, ${run.delay} seconds apart.` : `Post #${batch[0].n} goes up straight away.`,
       `${many ? 'They are' : 'It is'} public as soon as ${many ? 'they are' : 'it is'} published and cannot be taken back from this app.`];
  if (warn.length) lines.push('', 'Check first:', ...warn.map(w => '• ' + w));
  if (!confirm(lines.join('\n'))) return;

  const note = text => { run.note = text; if (run.noteEl) { run.noteEl.textContent = text; run.noteEl.hidden = !text; } };
  const lock = on => { $('header').inert = $('#library').inert = $('#stage').inert = on; $('#tabEdit').disabled = on; };
  run.active = true; run.stop = false; run.error = ''; tab = 'post'; state.selected = null;
  lock(true); renderAll();
  const cache = new Map();
  let current = batch[0].n, publishing = false, done = 0;
  try {
    for (let i = 0; i < batch.length; i++) {
      const { t, n } = batch[i], label = `#${n} of ${order.length}`;
      current = n;
      note(`Preparing post ${label}…`);
      const blob = await renderTileBlob(t, cache);
      const { stage_id } = await api('/api/stage?name=' + encodeURIComponent(tileName(t, n)), { method: 'PUT', body: blob });
      note(`Publishing post ${label}…${done ? '' : ' The first one can take a minute while the public link opens.'}`);
      let res;
      publishing = true;
      try { res = await api('/api/publish', { method: 'POST', json: { stage_id, caption: t.item.caption || '' } }); }
      catch (e) {
        if (!(e.data && e.data.duplicate)) throw e;
        const when = new Date((e.data.duplicate.time || 0) * 1000).toLocaleString();
        if (!confirm(`Post #${n} was already published from this PC (${when}).\n\nOK: tick it as posted and carry on.\nCancel: stop here.`)) throw new Error('it was already published earlier and you chose to stop');
        res = { permalink: e.data.duplicate.permalink || '' };
      }
      publishing = false;
      state.posted[t.key] = true;
      if (igLink(res.permalink)) state.links[t.key] = res.permalink;
      if (res.quota) server.quota = res.quota;
      done++; changed();
      if (run.stop || i === batch.length - 1) break;
      for (let s = run.delay; s > 0 && !run.stop; s--) { note(`Post ${label} is up. Next one in ${s} s…`); await sleep(1000); }
      if (run.stop) break;
    }
    toast(server.practice ? `Practice run finished: ${done} post${done === 1 ? '' : 's'} went through every step.` : `${done} post${done === 1 ? '' : 's'} published.`);
  } catch (e) {
    const unsure = e.lost && publishing;
    run.error = `Stopped at post #${current}: ${e.message}` + (unsure
      ? ' It may or may not have gone up — check your profile, and tick it by hand if it is there, before posting anything else.'
      : (e.data && e.data.uncertain ? '' : ' Nothing from this post onward was published.'));
  } finally {
    run.active = false; run.stop = false; note(''); lock(false);
    renderAll();                              // unlock the buttons straight away, then update the usage count
    await refreshServer(true); renderAll();
  }
}

// ---------- persistence ----------
function serialize() {
  return { format: state.format, bg: state.bg, sharpen: state.sharpen, showOrder: state.showOrder, posted: { ...state.posted }, links: { ...state.links },
    items: state.items.map(({ id, imageId, row, col, w, h, z, cx, cy, caption, frame }) => ({ id, imageId, row, col, w, h, z, cx, cy, caption: caption || '', frame: frame ? { ...frame } : undefined })) };
}
function cleanFrame(f) {
  if (!f || typeof f !== 'object') return null;
  return { style: Object.hasOwn(FRAMES, f.style) ? f.style : '', fit: f.fit === 'fill' ? 'fill' : 'whole',
    back: Object.hasOwn(BACKS, f.back) ? f.back : 'fill', blur: Number.isFinite(+f.blur) ? clamp(Math.round(+f.blur), 0, 100) : 40, camera: f.camera !== false, lens: f.lens !== false, settings: f.settings !== false,
    film: f.film !== false, date: f.date === true, note: String(f.note || '').slice(0, 60) };
}
function applyState(p) {
  const int = (v, a, b, d) => Number.isFinite(+v) ? clamp(Math.round(+v), a, b) : d;
  const num = (v, d) => Number.isFinite(+v) ? +v : d;
  p = p && typeof p === 'object' ? p : {};
  state.format = Object.hasOwn(FORMATS, p.format) ? p.format : '4x5';
  state.bg = /^#[0-9a-f]{6}$/i.test(p.bg) ? p.bg : '#ffffff';
  state.sharpen = Object.hasOwn(SHARPEN, p.sharpen) ? p.sharpen : 'std';
  state.showOrder = p.showOrder !== false;
  state.items = []; state.selected = null;
  for (const raw of Array.isArray(p.items) ? p.items : []) {
    if (!raw || !images.has(String(raw.imageId))) continue;
    const w = int(raw.w, 1, COLS, 1), h = int(raw.h, 1, MAXH, 1);
    const it = { id: String(raw.id || uid()), imageId: String(raw.imageId), w, h, col: int(raw.col, 0, COLS - w, 0), row: int(raw.row, 0, 500, 0),
      z: clamp(num(raw.z, 1), ZMIN, ZMAX), cx: num(raw.cx, 0.5), cy: num(raw.cy, 0.5), caption: String(raw.caption || '').slice(0, 2200) };
    const frame = cleanFrame(raw.frame); if (frame) it.frame = frame;
    if (overlapping(it.row, it.col, w, h, it.id).length) continue;
    clampItem(it); state.items.push(it);
  }
  const keys = new Set(tiles().map(t => t.key)); state.posted = {}; state.links = {};
  for (const k of Object.keys(p.posted && typeof p.posted === 'object' ? p.posted : {})) if (keys.has(k)) state.posted[k] = true;
  for (const [k, v] of Object.entries(p.links && typeof p.links === 'object' ? p.links : {})) if (keys.has(k) && igLink(v)) state.links[k] = v;
}
function syncControls() {
  $('#format').value = state.format; $('#bg').value = state.bg; $('#sharpen').value = state.sharpen; $('#showOrder').checked = state.showOrder;
  document.documentElement.style.setProperty('--post-bg', state.bg);
}

const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbStore = (name, mode) => db.transaction(name, mode).objectStore(name);
function dbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('grid-planner', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('images'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
const dbFail = () => { $('#saveNote').textContent = `Autosave isn't working${inProgram ? '' : ' in this browser'}. Use “Save project file” to keep your plan.`; };
function dbPutImage(rec) { if (db) idbReq(idbStore('images', 'readwrite').put({ id: rec.id, name: rec.name, blob: rec.blob, previewBlob: rec.previewBlob, added: rec.added }, rec.id)).catch(dbFail); }
function dbDelImage(id) { if (db) idbReq(idbStore('images', 'readwrite').delete(id)).catch(dbFail); }
let ready = false;                      // true once the saved plan is back on screen; nothing is written before that, or an empty page could replace it
const saveNow = () => { if (db && ready) idbReq(idbStore('kv', 'readwrite').put(serialize(), 'project')).catch(dbFail); };
const save = debounce(saveNow, 350);
// Settles once the plan, and every photo handed to the database before it, is on disk. Grid Planner.exe waits for this before its window closes.
const flush = () => new Promise(res => {
  if (!db || !ready) return res();
  try {
    const tx = db.transaction(['kv', 'images'], 'readwrite', { durability: 'strict' });
    tx.objectStore('kv').put(serialize(), 'project');
    tx.oncomplete = tx.onerror = tx.onabort = () => res();
  } catch (e) { res(); }
});
async function restore() {
  const saved = await idbReq(idbStore('images', 'readonly').getAll());
  saved.sort((a, b) => (a.added || 0) - (b.added || 0));        // keep the photo list in the order photos were added
  for (const r of saved) {
    try { await addImage(r.blob, r.name, r.id, r.previewBlob, r.added); } catch (e) { /* skip unreadable */ }
  }
  applyState(await idbReq(idbStore('kv', 'readonly').get('project')));
}
function clearEverything() {
  for (const id of [...images.keys()]) removeImage(id);
  state.items = []; state.posted = {}; state.links = {}; state.selected = null;
}

const blobToDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
function dataURLToBlob(s) {
  const m = /^data:(image\/[\w.+-]+);base64,(.*)$/s.exec(String(s)); if (!m) throw new Error('bad image data');
  const bin = atob(m[2]), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: m[1] });
}
async function saveProjectFile() {
  const imgs = [];
  await withBusy('Saving project…', async () => {
    for (const rec of images.values()) imgs.push({ id: rec.id, name: rec.name, data: await blobToDataURL(rec.blob) });
  });
  download(new Blob([JSON.stringify({ app: 'grid-planner', version: 1, project: serialize(), images: imgs })], { type: 'application/json' }), `grid-plan_${today()}.json`);
}
async function openProjectFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (!data || data.app !== 'grid-planner' || !Array.isArray(data.images)) { toast('That file is not a Grid Planner project.'); return; }
  if (images.size && !confirm('Opening this project replaces what is on screen now. Continue?')) return;
  let readable = !data.images.length;
  await withBusy('Opening project…', async () => {
    const photos = [];
    for (const im of data.images) { try { photos.push({ blob: dataURLToBlob(im && im.data), name: im.name, id: String(im.id) }); } catch (e) { /* skip */ } }
    for (const p of photos) {            // make sure at least one photo can be read before the plan on screen is thrown away
      const url = URL.createObjectURL(p.blob);
      try { await loadImg(url); readable = true; } catch (e) { /* try the next one */ }
      URL.revokeObjectURL(url);
      if (readable) break;
    }
    if (!readable) return;
    clearEverything();
    for (const p of photos) { try { const rec = await addImage(p.blob, p.name, p.id); dbPutImage(rec); } catch (e) { /* skip */ } }
    applyState(data.project); syncControls();
  });
  if (!readable) { toast('None of the photos in that file could be read, so nothing was changed.'); return; }
  changed();
}

// ---------- wiring ----------
function bindUI() {
  const sel = $('#format');
  for (const [k, f] of Object.entries(FORMATS)) sel.append(el('option', { value: k, text: f.label }));
  sel.addEventListener('change', () => { state.format = sel.value; state.items.forEach(clampItem); changed(); });
  $('#bg').addEventListener('input', e => {
    state.bg = e.target.value; document.documentElement.style.setProperty('--post-bg', state.bg);
    for (const it of state.items) if (framed(it)) repositionItem(it);      // frames are drawn in the fill color
    save();
  });
  $('#sharpen').addEventListener('change', e => { state.sharpen = e.target.value; save(); });
  $('#showOrder').addEventListener('change', e => { state.showOrder = e.target.checked; changed(); });
  $('#btnAdd').addEventListener('click', () => { pick = { mode: 'library' }; $('#filePick').click(); });
  $('#btnZip').addEventListener('click', exportZip);
  $('#btnPlaceAll').addEventListener('click', () => {
    const used = new Set(state.items.map(it => it.imageId));
    placeMany([...images.keys()].filter(id => !used.has(id)), 0, false);
  });
  $('#btnRowTop').addEventListener('click', () => { state.items.forEach(it => { it.row++; }); changed(); });
  $('#btnCompact').addEventListener('click', () => {
    const busy = new Set(); for (const it of state.items) for (let j = 0; j < it.h; j++) busy.add(it.row + j);
    const shift = r => { let n = 0; for (let i = 0; i < r; i++) if (!busy.has(i)) n++; return n; };
    state.items.forEach(it => { it.row -= shift(it.row); }); changed();
  });
  $('#tabEdit').addEventListener('click', () => { tab = 'edit'; renderAll(); });
  $('#tabPost').addEventListener('click', () => { tab = 'post'; renderAll(); });
  $('#filePick').addEventListener('change', async e => {
    const files = [...e.target.files], p = pick || { mode: 'library' }; e.target.value = ''; pick = null;
    if (!files.length) return;
    const recs = await importFiles(p.mode === 'replace' ? files.slice(0, 1) : files);
    if (!recs.length) { renderAll(); return; }
    if (p.mode === 'cell') placeMany(recs.map(r => r.id), p.index, false);
    else if (p.mode === 'replace') {
      const it = state.items.find(x => x.id === p.itemId);
      if (it) swapPhoto(it, recs[0].id);
      changed();
    } else renderAll();
  });
  const menu = $('#projMenu');
  $('#btnSave').addEventListener('click', async () => { menu.open = false; if (!images.size) { toast('Nothing to save yet.'); return; } await saveProjectFile(); });
  $('#btnOpen').addEventListener('click', () => { menu.open = false; $('#projPick').click(); });
  $('#projPick').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (f) await openProjectFile(f); });
  $('#btnClear').addEventListener('click', () => {
    menu.open = false;
    if (!images.size || confirm('Remove every photo and clear the grid? This cannot be undone.')) { clearEverything(); changed(); }
  });
  document.addEventListener('pointerdown', e => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
  window.addEventListener('keydown', e => {
    if (run.active || busyCount || e.target.closest('input, select, textarea')) return;
    const it = selItem();
    if (e.key === 'Escape' && it) { state.selected = null; renderAll(); }
    if ((e.key === 'Delete' || (isMac && e.key === 'Backspace')) && it) { e.preventDefault(); takeOff(it); }      // a Mac's delete key sends Backspace
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && putBack()) e.preventDefault();
  });
  // a change made just before the page is closed or hidden is written at once instead of waiting for the usual short pause
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('resize', debounce(renderAll, 120));
  if (onWeb) {          // the web copy: works offline once opened, and asks the browser not to clear the plan
    $('#saveNote').textContent = 'Your plan is saved automatically in this browser on this computer. Use “Save project file” now and then as a backup.';
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  if (inProgram) {
    $('#saveNote').textContent = 'Your plan is saved automatically on this PC.';
    window.chrome.webview.addEventListener('message', e => { if (e.data === 'closing') flush().then(() => window.chrome.webview.postMessage('saved')); });
  }
}

async function init() {
  bindUI();
  try { db = await dbOpen(); await withBusy('Opening your saved plan…', restore); } catch (e) { db = null; dbFail(); }     // the page is locked until the plan is back
  ready = true;
  syncControls(); renderAll();
  await refreshServer(true); renderAll();
}
window.gridPlanner = { state, images, importFiles, placeMany, setSpan, renderAll, changed, postingOrder, renderTile, renderTileBlob, makeZip, geom, fmt, checks, run, postRun, readExif, shotInfo, newFrame, get server() { return server; } };
init();
})();
</script>
</body>
</html>
